services:
  postgres:
    image: postgres:16
    container_name: avito-kitchen-postgres
    environment:
      POSTGRES_DB: kitchen
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d kitchen"]
      interval: 5s
      timeout: 5s
      retries: 5

  kitchen-api:
    build:
      context: ./services/kitchen-api
    container_name: avito-kitchen-api
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/kitchen
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    command: >
      sh -c "uv run alembic upgrade head &&
        uv run uvicorn app.main:app --host 0.0.0.0 --port 8000"

  demo-restaurant:
    build:
      context: ./services/demo-restaurant
    container_name: avito-kitchen-demo-restaurant
    environment:
      KITCHEN_API_URL: http://kitchen-api:8000
    ports:
      - "8001:8001"
    depends_on:
      kitchen-api:
        condition: service_started
    command: >
      uv run uvicorn app.main:app --host 0.0.0.0 --port 8001

volumes:
  postgres_data: