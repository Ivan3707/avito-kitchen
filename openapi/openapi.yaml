openapi: 3.1.0

info:
  title: Avito Kitchen API
  description: |
    HTTP API учебного backend-проекта Avito-Kitchen.

    Спецификация описывает текущие маршруты Kitchen API, а не будущие
    контракты Demo Restaurant, аутентификации или Kafka. X-User-Email —
    временная идентификация покупателя, не механизм аутентификации.
    Межсервисная аутентификация пока не реализована.

    API разделён на две части:

    1. Client API — API для клиентского приложения:
       просмотр ресторанов, филиалов и меню,
       работа с корзиной и оформление заказа.

    2. Restaurant Integration API — API для интеграции
       ресторанов с Kitchen API:
       синхронизация каталога и проверка/создание заказов.
  version: 1.0.0

servers:
  - url: http://localhost:8000

tags:
  - name: catalog
    description: Client catalog API
  - name: cart
    description: Client cart API
  - name: integration
    description: Restaurant integration API

paths:

  # ============================================================
  # CLIENT API — CATALOG
  # ============================================================

  /api/v1/restaurants:
    get:
      tags:
        - catalog
      summary: Get restaurants
      operationId: getRestaurants
      responses:
        "200":
          description: List of restaurants
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RestaurantResponse"

  /api/v1/restaurants/{restaurant_id}/branches:
    get:
      tags:
        - catalog
      summary: Get restaurant branches
      operationId: getRestaurantBranches
      parameters:
        - name: restaurant_id
          in: path
          required: true
          description: Internal restaurant identifier
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: List of restaurant branches
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BranchResponse"
        "422":
          $ref: "#/components/responses/ValidationError"

  /api/v1/branches/{branch_id}/menu:
    get:
      tags:
        - catalog
      summary: Get branch menu
      operationId: getBranchMenu
      parameters:
        - name: branch_id
          in: path
          required: true
          description: Internal branch identifier
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Branch menu
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BranchMenuResponse"
        "422":
          $ref: "#/components/responses/ValidationError"

  # ============================================================
  # CLIENT API — CART
  # ============================================================

  /api/v1/branches/{branch_id}/cart:
    get:
      tags:
        - cart
      summary: Get customer cart
      operationId: getCart
      parameters:
        - $ref: "#/components/parameters/BranchId"
        - $ref: "#/components/parameters/UserEmail"
      responses:
        "200":
          description: Customer cart
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CartResponse"
        "422":
          $ref: "#/components/responses/ValidationError"

    # ========================================================
    # ADD CART ITEM
    # ========================================================

  /api/v1/branches/{branch_id}/cart/items:
    post:
      tags:
        - cart
      summary: Add item to cart
      operationId: addCartItem
      parameters:
        - $ref: "#/components/parameters/BranchId"
        - $ref: "#/components/parameters/UserEmail"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddCartItemRequest"
      responses:
        "200":
          description: Updated cart
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CartResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationError"

  # ============================================================
  # UPDATE CART ITEM
  # ============================================================

  /api/v1/branches/{branch_id}/cart/items/{menu_item_id}:
    patch:
      tags:
        - cart
      summary: Update cart item quantity
      operationId: updateCartItem
      parameters:
        - $ref: "#/components/parameters/BranchId"
        - $ref: "#/components/parameters/MenuItemId"
        - $ref: "#/components/parameters/UserEmail"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateCartItemRequest"
      responses:
        "200":
          description: Updated cart
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CartResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"

    delete:
      tags:
        - cart
      summary: Remove item from cart
      operationId: removeCartItem
      parameters:
        - $ref: "#/components/parameters/BranchId"
        - $ref: "#/components/parameters/MenuItemId"
        - $ref: "#/components/parameters/UserEmail"
      responses:
        "200":
          description: Updated cart
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CartResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"

  # ============================================================
  # CHECKOUT
  # ============================================================

  /api/v1/branches/{branch_id}/cart/checkout:
    post:
      tags:
        - cart
      summary: Checkout customer cart
      operationId: checkoutCart
      parameters:
        - $ref: "#/components/parameters/BranchId"
        - $ref: "#/components/parameters/UserEmail"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CheckoutRequest"
      responses:
        "200":
          description: Checkout result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheckoutResponse"
        "422":
          $ref: "#/components/responses/ValidationError"

  # ============================================================
  # RESTAURANT INTEGRATION API
  # ============================================================

  /integration/v1/sync:
    post:
      tags:
        - integration
      summary: Synchronize restaurant catalog
      operationId: syncRestaurant
      description: |
        Accepts a full snapshot of the restaurant catalog.

        Accepts schema_version=3 only. snapshot_id identifies a logical snapshot;
        catalog_revision is the non-negative, monotonic version of the entire
        restaurant catalog. generated_at is a timezone-aware diagnostic timestamp,
        not an ordering key. branch_version is not part of this wire contract.

        Kitchen serializes concurrent synchronization per restaurant and applies
        a newer full snapshot atomically, including jumps across revisions.
        Missing branches and menu items are deactivated; missing relations are
        made unavailable. Historical order references are preserved.

        Kitchen computes SHA-256 over canonical business content, excluding
        transport metadata (including snapshot_id, generated_at, schema_version
        and catalog_revision). The order of arrays does not affect the checksum.
        The same current revision with different business content, or reuse of a
        known snapshot_id with a different restaurant, revision or checksum,
        results in HTTP 409. An older revision is ignored. A repeated known
        snapshot is ignored; a new ID with the same current revision and checksum
        is also ignored. Current revision and checksum outlive history cleanup.
        History older than 30 days is cleaned during subsequent synchronization
        of the corresponding restaurant, not by an independent scheduler.

        A retry of the same logical delivery must preserve the original payload,
        snapshot_id and revision. Building another snapshot creates a new ID.
        Partial updates are not accepted by this endpoint.

        The snapshot contains:
        - restaurant information;
        - all restaurant branches;
        - menu and menu items;
        - price (integer kopecks, RUB) and availability of every menu item in every branch.

        External IDs are unique within the corresponding collections. Availability
        must contain exactly one entry for each branch, with exactly one entry for
        each menu item. Inactive branches cannot accept orders; inactive branches
        or items cannot have available items. Available items require positive prices.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SyncPayload"
            example:
              snapshot_id: "c5e7e9a1-9cb7-4e74-9e41-0b5371ee5b61"
              schema_version: 3
              catalog_revision: 1
              generated_at: "2026-11-24T12:00:00Z"
              restaurant:
                external_id: restaurant-001
                name: Demo Restaurant
                description: null
              branches:
                - external_id: branch-001
                  name: Central branch
                  address: Main Street 1
                  is_active: true
                  is_accepting_orders: true
              menu:
                external_id: menu-001
                name: Main Menu
                items:
                  - external_id: item-001
                    name: Pizza
                    description: null
                    is_active: true
              availability:
                - branch_external_id: branch-001
                  items:
                    - menu_item_external_id: item-001
                      is_available: true
                      price: 35000
      responses:
        "200":
          description: Synchronization result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SyncResponse"
        "409":
          description: Conflicting snapshot identity or different business content for the current revision.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                detail: catalog revision already exists with different business content
        "422":
          description: Invalid snapshot (including unsupported schema_version or invalid cross-references).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"

  /integration/v1/orders/validate:
    post:
      tags:
        - integration
      summary: Validate order
      operationId: validateOrder
      description: |
        Validates an order against the current Kitchen API catalog.

        Validation checks:
        - branch availability;
        - product existence;
        - product availability;
        - product availability in the requested branch;
        - current product price.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderValidationRequest"
      responses:
        "200":
          description: Order validation result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderValidationResponse"
        "422":
          $ref: "#/components/responses/ValidationError"

  /integration/v1/orders:
    post:
      tags:
        - integration
      summary: Create order
      operationId: createOrder
      description: |
        Creates an order in the restaurant.

        The order_id identifies one logical order creation operation
        and is used as an idempotency key.

        Multiple HTTP requests with the same order_id may represent
        retries of the same logical operation.

        If the same order_id is received with the same request payload,
        a previously stored final result is returned when available.

        If the same order_id is received with a different request payload,
        the request is rejected as a business validation result.

        An accepted=false response is returned with HTTP 200.
        RESTAURANT_TIMEOUT indicates an unknown result, not a confirmed
        business rejection; retry the original operation with the same order_id.
        Automatic background recovery is not implemented in this baseline.

        The Kitchen API first validates the requested order against
        its current catalog and then sends the order to the restaurant.
      parameters:
        - $ref: "#/components/parameters/UserEmail"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOrderRequest"
      responses:
        "200":
          description: Order creation result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateOrderResponse"
        "422":
          $ref: "#/components/responses/ValidationError"

# ==============================================================
# COMPONENTS
# ==============================================================

components:

  # ============================================================
  # PARAMETERS
  # ============================================================

  parameters:

    BranchId:
      name: branch_id
      in: path
      required: true
      description: Internal branch identifier
      schema:
        type: string
        format: uuid

    MenuItemId:
      name: menu_item_id
      in: path
      required: true
      description: Internal menu item identifier
      schema:
        type: string
        format: uuid

    UserEmail:
      name: X-User-Email
      in: header
      required: true
      description: Temporary customer identifier; not proof of identity or authentication.
      schema:
        type: string
        minLength: 1

  # ============================================================
  # COMMON SCHEMAS
  # ============================================================

  responses:
    NotFound:
      description: Requested resource not found.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Conflict:
      description: Request conflicts with current state.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ValidationError:
      description: Request validation failed (FastAPI/Pydantic).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/HTTPValidationError"

  schemas:

    ErrorResponse:
      type: object
      required: [detail]
      properties:
        detail:
          type: string

    HTTPValidationError:
      type: object
      required: [detail]
      properties:
        detail:
          type: array
          items:
            $ref: "#/components/schemas/ValidationError"

    ValidationError:
      type: object
      required: [loc, msg, type]
      properties:
        loc:
          type: array
          items:
            anyOf:
              - type: string
              - type: integer
        msg:
          type: string
        type:
          type: string
      additionalProperties: true

    NonEmptyString:
      type: string
      minLength: 1

    BusinessErrorCode:
      type: string
      enum:
        - BRANCH_UNAVAILABLE
        - PRODUCT_NOT_FOUND
        - PRODUCT_UNAVAILABLE
        - INSUFFICIENT_QUANTITY
        - PRICE_CHANGED
        - RESTAURANT_TIMEOUT
        - RESTAURANT_REJECTED
        - ORDER_ID_CONFLICT

    # ==========================================================
    # CATALOG RESPONSE SCHEMAS
    # ==========================================================

    RestaurantResponse:
      type: object
      required:
        - id
        - name
        - description
      properties:
        id:
          type: string
          format: uuid

        name:
          $ref: "#/components/schemas/NonEmptyString"

        description:
          type:
            - string
            - "null"

    BranchResponse:
      type: object
      required:
        - id
        - name
        - address
        - is_active
        - is_accepting_orders
      properties:
        id:
          type: string
          format: uuid

        name:
          $ref: "#/components/schemas/NonEmptyString"

        address:
          $ref: "#/components/schemas/NonEmptyString"

        is_active:
          type: boolean

        is_accepting_orders:
          type: boolean

    MenuItemResponse:
      type: object
      required:
        - id
        - external_id
        - name
        - description
        - price
        - is_available
      properties:
        id:
          type: string
          format: uuid

        external_id:
          $ref: "#/components/schemas/NonEmptyString"

        name:
          $ref: "#/components/schemas/NonEmptyString"

        description:
          type:
            - string
            - "null"

        price:
          type:
            - integer
            - "null"
          exclusiveMinimum: 0

        is_available:
          type: boolean

    BranchMenuResponse:
      type: object
      required:
        - branch_id
        - items
      properties:
        branch_id:
          type: string
          format: uuid

        items:
          type: array
          items:
            $ref: "#/components/schemas/MenuItemResponse"

    # ==========================================================
    # CART REQUEST SCHEMAS
    # ==========================================================

    AddCartItemRequest:
      type: object
      required:
        - menu_item_id
        - quantity
      properties:
        menu_item_id:
          type: string
          format: uuid

        quantity:
          type: integer
          minimum: 1

    UpdateCartItemRequest:
      type: object
      required:
        - quantity
      properties:
        quantity:
          type: integer
          minimum: 1

    # ==========================================================
    # CART RESPONSE SCHEMAS
    # ==========================================================

    CartItemResponse:
      type: object
      required:
        - menu_item_id
        - menu_item_external_id
        - name
        - price
        - quantity
        - is_available
      properties:
        menu_item_id:
          type: string
          format: uuid

        menu_item_external_id:
          $ref: "#/components/schemas/NonEmptyString"

        name:
          $ref: "#/components/schemas/NonEmptyString"

        price:
          type:
            - integer
            - "null"
          exclusiveMinimum: 0

        quantity:
          type: integer
          minimum: 1

        is_available:
          type: boolean

    CartResponse:
      type: object
      required:
        - id
        - branch_id
        - items
      properties:
        id:
          type: [string, "null"]
          format: uuid
          description: Null when no cart exists.

        branch_id:
          type: string
          format: uuid

        items:
          type: array
          items:
            $ref: "#/components/schemas/CartItemResponse"

    CheckoutRequest:
      type: object
      required:
        - order_id
      properties:
        order_id:
          $ref: "#/components/schemas/NonEmptyString"

    CheckoutResponse:
      type: object
      required:
        - accepted
        - order_id
        - restaurant_order_id
        - reason
      properties:
        accepted:
          type: boolean

        order_id:
          type:
            - string
            - "null"
          format: uuid

        restaurant_order_id:
          type:
            - string
            - "null"
          minLength: 1

        reason:
          type:
            - string
            - "null"

    # ==========================================================
    # SYNC SCHEMAS
    # ==========================================================

    SyncStatus:
      type: string
      enum:
        - updated
        - ignored

    RestaurantSync:
      type: object
      additionalProperties: false
      required:
        - external_id
        - name
        - description
      properties:
        external_id:
          $ref: "#/components/schemas/NonEmptyString"

        name:
          $ref: "#/components/schemas/NonEmptyString"

        description:
          type:
            - string
            - "null"

    BranchSync:
      type: object
      additionalProperties: false
      if:
        properties:
          is_active: {const: false}
        required: [is_active]
      then:
        properties:
          is_accepting_orders: {const: false}
      required:
        - external_id
        - name
        - address
        - is_active
        - is_accepting_orders
      properties:
        external_id:
          $ref: "#/components/schemas/NonEmptyString"

        name:
          $ref: "#/components/schemas/NonEmptyString"

        address:
          $ref: "#/components/schemas/NonEmptyString"

        is_active:
          type: boolean

        is_accepting_orders:
          type: boolean

    MenuItemSync:
      type: object
      additionalProperties: false
      required:
        - external_id
        - name
        - description
        - is_active
      properties:
        external_id:
          $ref: "#/components/schemas/NonEmptyString"

        name:
          $ref: "#/components/schemas/NonEmptyString"

        description:
          type:
            - string
            - "null"

        is_active:
          type: boolean

    MenuSync:
      type: object
      additionalProperties: false
      required:
        - external_id
        - name
        - items
      properties:
        external_id:
          $ref: "#/components/schemas/NonEmptyString"

        name:
          $ref: "#/components/schemas/NonEmptyString"

        items:
          type: array
          items:
            $ref: "#/components/schemas/MenuItemSync"

    MenuItemAvailabilitySync:
      type: object
      additionalProperties: false
      if:
        properties:
          is_available: {const: true}
        required: [is_available]
      then:
        properties:
          price: {type: integer, exclusiveMinimum: 0}
      required:
        - menu_item_external_id
        - is_available
        - price
      properties:
        menu_item_external_id:
          $ref: "#/components/schemas/NonEmptyString"

        is_available:
          type: boolean

        price:
          type:
            - integer
            - "null"
          exclusiveMinimum: 0
          description: Price in integer kopecks (RUB); null is allowed only when unavailable.

    BranchAvailabilitySync:
      type: object
      additionalProperties: false
      required:
        - branch_external_id
        - items
      properties:
        branch_external_id:
          $ref: "#/components/schemas/NonEmptyString"

        items:
          type: array
          items:
            $ref: "#/components/schemas/MenuItemAvailabilitySync"

    SyncPayload:
      type: object
      additionalProperties: false
      required:
        - snapshot_id
        - schema_version
        - catalog_revision
        - generated_at
        - restaurant
        - branches
        - menu
        - availability
      properties:
        snapshot_id:
          type: string
          format: uuid

        schema_version:
          type: integer
          const: 3
          description: Full snapshot wire contract version.

        catalog_revision:
          type: integer
          minimum: 0
          description: Monotonic revision of the complete restaurant catalog; 0 is valid.

        generated_at:
          type: string
          format: date-time
          description: Timezone-aware generation timestamp; not used for ordering.

        restaurant:
          $ref: "#/components/schemas/RestaurantSync"

        branches:
          type: array
          items:
            $ref: "#/components/schemas/BranchSync"

        menu:
          $ref: "#/components/schemas/MenuSync"

        availability:
          type: array
          items:
            $ref: "#/components/schemas/BranchAvailabilitySync"

    UpdatedSyncResponse:
      type: object
      required:
        - status
        - snapshot_id
      properties:
        status:
          type: string
          enum:
            - updated

        snapshot_id:
          type: string
          format: uuid

    IgnoredSyncResponse:
      type: object
      required:
        - status
        - snapshot_id
        - reason
      properties:
        status:
          type: string
          enum:
            - ignored

        snapshot_id:
          type: string
          format: uuid

        reason:
          type: string
          enum:
            - DUPLICATE_SNAPSHOT
            - DUPLICATE_STATE
            - STALE_SNAPSHOT
          description: Known snapshot ID, identical current revision and checksum, or older revision, respectively.

    SyncResponse:
      oneOf:
        - $ref: "#/components/schemas/UpdatedSyncResponse"
        - $ref: "#/components/schemas/IgnoredSyncResponse"
      discriminator:
        propertyName: status
        mapping:
          updated: "#/components/schemas/UpdatedSyncResponse"
          ignored: "#/components/schemas/IgnoredSyncResponse"

    # ==========================================================
    # ORDER REQUEST SCHEMAS
    # ==========================================================

    OrderItemRequest:
      type: object
      required:
        - menu_item_external_id
        - quantity
        - unit_price
      properties:
        menu_item_external_id:
          $ref: "#/components/schemas/NonEmptyString"

        quantity:
          type: integer
          minimum: 1

        unit_price:
          type: integer
          exclusiveMinimum: 0
          description: Unit price in integer kopecks (RUB).

    OrderValidationRequest:
      type: object
      description: Each menu_item_external_id must occur at most once in items.
      required:
        - restaurant_external_id
        - branch_external_id
        - items
      properties:
        restaurant_external_id:
          $ref: "#/components/schemas/NonEmptyString"

        branch_external_id:
          $ref: "#/components/schemas/NonEmptyString"

        items:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/OrderItemRequest"

    CreateOrderRequest:
      type: object
      description: Each menu_item_external_id must occur at most once in items.
      required:
        - order_id
        - restaurant_external_id
        - branch_external_id
        - items
      properties:
        order_id:
          $ref: "#/components/schemas/NonEmptyString"

        restaurant_external_id:
          $ref: "#/components/schemas/NonEmptyString"

        branch_external_id:
          $ref: "#/components/schemas/NonEmptyString"

        items:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/OrderItemRequest"

    # ==========================================================
    # ORDER VALIDATION RESPONSE
    # ==========================================================

    ValidationIssue:
      type: object
      required:
        - code
        - message
      properties:
        code:
          $ref: "#/components/schemas/BusinessErrorCode"

        message:
          $ref: "#/components/schemas/NonEmptyString"

        menu_item_external_id:
          type:
            - string
            - "null"
          minLength: 1

        old_price:
          type:
            - integer
            - "null"
          exclusiveMinimum: 0

        current_price:
          type:
            - integer
            - "null"
          exclusiveMinimum: 0

    OrderValidationResponse:
      type: object
      required:
        - valid
        - issues
      properties:
        valid:
          type: boolean

        issues:
          type: array
          items:
            $ref: "#/components/schemas/ValidationIssue"

    # ==========================================================
    # CREATE ORDER RESPONSE
    # ==========================================================

    CreateOrderResponse:
      type: object
      required:
        - accepted
      properties:
        accepted:
          type: boolean

        order_id:
          type:
            - string
            - "null"
          format: uuid
          description: Local Kitchen API order identifier.

        restaurant_order_id:
          type:
            - string
            - "null"
          minLength: 1
          description: Restaurant-owned order identifier.

        reason:
          anyOf:
            - $ref: "#/components/schemas/ValidationIssue"
            - type: "null"

      description: |
        If accepted is true, order_id and restaurant_order_id are returned
        and reason is null.

        If accepted is false, reason is returned and
        restaurant_order_id is null.

        order_id may be null for rejected orders.
