[project]
name = "kitchen-api"
version = "0.1.0"
description = "Kitchen marketplace API"
requires-python = ">=3.13"

dependencies = [
"fastapi>=0.115,<1.0",
"pydantic>=2.0,<3.0",
"pydantic-settings>=2.0,<3.0",
"sqlalchemy>=2.0,<3.0",
"asyncpg>=0.30,<1.0",
"alembic>=1.0,<2.0",
"uvicorn[standard]>=0.52.4",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=8.0,<9.0",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.14,<1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"

[tool.ruff]
target-version = "py313"
line-length = 79

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
]

ignore = [
    "E501",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
